
<script>
(() => {
const D = JSON.parse(document.querySelector('#source').textContent);
const A = [...D.lessons, ...D.extras].sort((a,b) => a.page-b.page);
let selected = A[0], correct = 0, total = 0;

const css = `
body{margin:0!important;background:#f4f6ff;color:#2d3552;font-family:Tahoma,Arial}
#newchat{height:100dvh;display:flex;flex-direction:column}
#nc-head{background:#fff;padding:14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e4f2}
#nc-head b{color:#5638ad}
#nc-head button,.nc-opts button{border:1px solid #d8d2f4;background:#eee9ff;color:#5843aa;border-radius:12px;padding:10px}
#nc-top{padding:10px;background:#fff;border-bottom:1px solid #e5e4f2}
#nc-top select{width:100%;border:1px solid #ddd7ed;padding:10px;background:white;border-radius:10px}
#nc-log{flex:1;overflow:auto;padding:15px}
#nc-log article{width:max-content;max-width:92%;white-space:pre-wrap;line-height:2;background:#fff;border:1px solid #e6e8f2;padding:12px 14px;border-radius:16px 16px 5px 16px;font-size:13px;margin:8px 0;overflow-wrap:anywhere}
#nc-log article.me{margin-right:auto;background:#684bc7;color:white;border:0;border-radius:16px 16px 16px 5px}
.nc-opts{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}
#nc-foot{padding:11px;background:white;border-top:1px solid #e5e4f2}
#nc-form{display:flex;gap:8px}
#nc-form input{min-width:0;flex:1;padding:12px;border:1px solid #ddd7ed;border-radius:12px}
#nc-form button{border:0;background:#684bc7;color:white;border-radius:12px;padding:10px 14px}
#nc-foot small{color:#8d92a4;font-size:10px}`;

const style = document.createElement('style');
style.textContent = css;
document.head.appendChild(style);

document.body.innerHTML = `
<main id="newchat">
  <div id="nc-head">
    <b>🤖 همیار فارسی ششم</b>
    <div>
      <button id="nc-report">📈 کارنامه</button>
      <button id="nc-teacher">👩‍🏫 معلم</button>
    </div>
  </div>
  <div id="nc-top">
    <select id="nc-select"></select>
  </div>
  <section id="nc-log"></section>
  <div id="nc-foot">
    <div class="nc-opts" id="nc-short"></div>
    <form id="nc-form">
      <input id="nc-input" placeholder="درباره درس سؤال بپرس...">
      <button>ارسال ➤</button>
    </form>
    <small>نسخه راهنمای آفلاین؛ پاسخ AI واقعی نیازمند سرور امن است.</small>
  </div>
</main>`;

const $ = s => document.querySelector(s);
const log = $('#nc-log');

function say(t, me=false) {
  const a = document.createElement('article');
  a.className = me ? 'me' : '';
  a.textContent = t;
  log.appendChild(a);
  log.scrollTop = log.scrollHeight;
}

function opts(a, at=$('#nc-short')) {
  at.innerHTML = '';
  a.forEach(([t,fn]) => {
    const b = document.createElement('button');
    b.textContent = t;
    b.onclick = fn;
    at.appendChild(b);
  });
}

$('#nc-select').innerHTML = A.map(x =>
  `<option value="${x.key}">${x.title} (ص ${x.page})</option>`
).join('');

function choose() {
  selected = A.find(x => x.key === $('#nc-select').value);
  log.innerHTML = '';
  say(`سلام! 🌷 بخش «${selected.title}» را انتخاب کردی.
می‌توانی سؤال بپرسی یا از دکمه‌های زیر استفاده کنی.`);
}

$('#nc-select').onchange = choose;

function send(q) {
  q = String(q || '').trim();
  if (!q) return;
  $('#nc-input').value = '';
  say(q, true);
  const x = selected;

  if (/بازی|آزمون/.test(q)) {
    startGame();
    return;
  }
  if (/پیام|مفهوم/.test(q)) {
    say(`💡 ${x.message}`);
  } else if (/معنی|واژه|لغت/.test(q)) {
    say('🔤 ' + x.words.map(p =>
      `${p[0]}: ${p[1]}`
    ).join('\n'));
  } else if (/زبان|ادبی|دستور|نکته/.test(q)) {
    say(`✍️ ${x.language}
تمرین: ${x.literacy_exercise}`);
  } else if (/نگارش|تکلیف|تمرین/.test(q)) {
    say(`📝 ${x.writing}`);
  } else {
    say(`📖 ${x.summary}

پیام: ${x.message}
صفحه کتاب: ${x.page}`);
  }
}

function startGame() {
  const x = selected;
  const Q = x.questions?.length ? x.questions[0] : null;
  if (!Q) return say('برای این بخش آزمونی ثبت نشده است.');

  say(`🎮 سؤال: ${Q.q}`);
  const bar = document.createElement('div');
  bar.className = 'nc-opts';

  Q.choices.forEach((v,i) => {
    const b = document.createElement('button');
    b.textContent = v;
    b.onclick = () => {
      say(v,true);
      say((i === Q.answer ? '✅ درست! ' : '🌱 پاسخ را مرور کن. ') + Q.explanation);
      correct += Number(i === Q.answer);
      total++;
      bar.remove();
      opts([
        ['بازی دوباره',startGame],
        ['معنی واژه‌ها',()=>send('واژگان')]
      ]);
    };
    bar.appendChild(b);
  });
  log.appendChild(bar);
  log.scrollTop = log.scrollHeight;
}

$('#nc-form').onsubmit = ev => {
  ev.preventDefault();
  send($('#nc-input').value);
};

$('#nc-report').onclick = () =>
  say(`📈 کارنامه این نشست: ${correct} پاسخ درست از ${total} سؤال.`);

$('#nc-teacher').onclick = () =>
  say('پنل معلم واقعی و هوش مصنوعی مولد، به سرور Node.js نیاز دارند و روی GitHub Pages اجرا نمی‌شوند.');

opts([
  ['📖 خلاصه',()=>send('خلاصه')],
  ['💡 پیام',()=>send('پیام')],
  ['🔤 واژگان',()=>send('واژگان')],
  ['🎮 بازی',startGame]
]);

choose();
})();
</script>
</body></html>
